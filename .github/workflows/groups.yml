name: CI Workflow Groups

on:
  workflow_run:
    workflows:
      - "Lint Toolchain"
      - "Lint Source"
      - "Spell Check"
      - "Pretty"
      - "Source DRYness"
      - "Lines of Code"
      - "Coverage Check"
      - "Cleanliness"
      - "Documentation"
      - "Deploy Homebrew Tap"
      - "Homebrew Formula Test"
    types:
      - completed

jobs:
  job_in_b:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "Quality Check workflows finished successfully.
             Running testing & benchmarking workflows."
  
  test-suite:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    uses: ./.github/workflows/test.yml

  benchmarks:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    uses: ./.github/workflows/bench.yml