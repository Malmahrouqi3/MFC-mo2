name: Nsight Profiling

on: [push, pull_request]

jobs:
  profiling:
    runs-on: ubuntu-latest
    steps:
      - name: Clone
        uses: actions/checkout@v4

      - name: Install CUDA
        uses: Jimver/cuda-toolkit@v0.2.24
        env:
          CC: gcc-9
          CXX: g++-9
        with:
          cuda: '11.8.0'
          linux-local-args: '["--toolkit", "--samples", "--override"]'

      - name: Setup Ubuntu
        run: |
           sudo apt update -y
           sudo apt install -y cmake gcc g++ python3 python3-dev hdf5-tools \
                    libfftw3-dev libhdf5-dev openmpi-bin libopenmpi-dev


      - name: Set CUDA environment variables
        run: |
          echo "/usr/local/cuda/bin" >> $GITHUB_PATH
          echo "CUDA_HOME=/usr/local/cuda" >> $GITHUB_ENV
          echo "LD_LIBRARY_PATH=/usr/local/cuda/lib64:$LD_LIBRARY_PATH" >> $GITHUB_ENV

      - name: Build (GPU)
        run: |
          source /etc/profile
          export PATH=/usr/local/cuda/bin:$PATH
          export LD_LIBRARY_PATH=/usr/local/cuda/lib64:$LD_LIBRARY_PATH
          /bin/bash mfc.sh test --dry-run --gpu -j $(nproc)
          
      - name: Run Nsight Profiling
        run: |
          nsys profile -o report ./mfc.sh test --gpu

      - name: Process Nsight Profiling Report
        run: |
          echo "=== Nsight Profiling Summary ==="
          nsys stats --report gputrace report.nsys-rep

          echo "=== TOP GPU KERNELS ==="
          nsys stats --report gpukernsum --format table report.nsys-rep | head -20
          
          echo "=== TOP CUDA API CALLS ==="
          nsys stats --report cudaapisum --format table report.nsys-rep | head -20

      - name: Upload Nsight Profiling Report
        uses: actions/upload-artifact@v4
        with:
          name: nsight-profiling-report
          path: report.nsys-rep