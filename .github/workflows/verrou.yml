name: Floating-Point Compliance

on: [pull_request, push]

jobs:
  Floating-Point_Compliance:
    runs-on: ubuntu-latest
    steps:
      - name: Clone PR
        uses: actions/checkout@v4

      - name: Setup
        run: |
          # get recent release of valgrind from GitHub API
            VERROU_VERSION=$(curl -s https://api.github.com/repos/edf-hpc/verrou/releases/latest | grep -oP '"tag_name": "\K(.*)(?=")')
            VERROU_NUMBER=${VERROU_VERSION#v}

            wget -P pr https://github.com/edf-hpc/verrou/releases/download/${VERROU_VERSION}/valgrind-3.23.0_verrou-${VERROU_NUMBER}.tar.gz
            cd pr
            tar -xzf valgrind-3.23.0_verrou-${VERROU_NUMBER}.tar.gz
            cd valgrind-3.23.0+verrou-${VERROU_NUMBER}
            ./autogen.sh
            ./configure --prefix=$HOME/.local
            make
            make install
            cd ../..
            rm -rf pr/valgrind-*

          sudo apt update -y
          sudo apt install -y cmake gcc g++ python3 python3-dev hdf5-tools \
                  libfftw3-dev libhdf5-dev openmpi-bin libopenmpi-dev

          ./mfc.sh build --no-mpi
          find examples/ -name case.py -exec sed -i 's/"parallel_io": *"T"/"parallel_io": "F"/g' {} +

          for case in examples/0D_*/case.py examples/1D_*/case.py; do
            echo "Running: $case"
            ./mfc.sh run "$case" >> cases.log 2>&1 || true
          done

      - name: Run Verrou
        run: |                    
          export PATH="$HOME/.local/bin:$PATH"
          mkdir -p verrou_reports
          # Find the simulation executable once, use absolute path
          SIM_EXE=$(find "$PWD/build/staging" -type f -name simulation | head -n 1)
          if [ ! -x "$SIM_EXE" ]; then
            echo "ERROR: simulation executable not found!"
            exit 1
          fi
          for inp in examples/*/simulation.inp; do
            case_dir=$(dirname "$inp")
            case_name=$(basename "$case_dir")
            run_dir="run_$case_name"
            mkdir -p "$run_dir"
            cp "$case_dir"/* "$run_dir"/ 2>/dev/null || true
            cp -r "$case_dir"/restart_data "$run_dir"/ 2>/dev/null || true

            for flags in \
              "--tool=verrou -s --rounding-mode=average_comdet" \
              "--tool=verrou -s --rounding-mode=random" \
              "--tool=verrou -s --rounding-mode=nearest"
            do
              flag_name=$(echo $flags | tr ' ' '_' | tr -d '=*?:"<>|')
              out_file="verrou_reports/${case_name}_${flag_name}.log"
              (
                cd "$run_dir"
                output=$(valgrind $flags "$SIM_EXE" 2>&1 || true)
                echo "$output" > "../$out_file"
                # Only display if ERROR SUMMARY is nonzero
                if echo "$output" | grep -qE "ERROR SUMMARY: [1-9][0-9]*"; then
                  echo "===== ${case_name} ${flags} ====="
                  echo "$output"
                fi
              )
            done
          done

      - name: Create Comparison Script
        run: |
          cat > compare_results.py << 'EOF'
          import sys
          import os
          import re
          
          def extractValue(log_file):
              """Extract numerical result from Verrou log file"""
              if not os.path.exists(log_file):
                  return None
              
              with open(log_file, 'r') as f:
                  content = f.read()
                  
              # Look for common result patterns in simulation output
              patterns = [
                  r'result[s]*\s*[=:]\s*([-+]?[0-9]*\.?[0-9]+([eE][-+]?[0-9]+)?)',
                  r'final[_\s]*value[s]*\s*[=:]\s*([-+]?[0-9]*\.?[0-9]+([eE][-+]?[0-9]+)?)',
                  r'output[s]*\s*[=:]\s*([-+]?[0-9]*\.?[0-9]+([eE][-+]?[0-9]+)?)'
              ]
              
              for pattern in patterns:
                  match = re.search(pattern, content, re.IGNORECASE)
                  if match:
                      return float(match.group(1))
              
              return None
          
          def compare_results(ref_file, test_file, tolerance=1e-6):
              """Compare two result files"""
              ref_val = extractValue(ref_file)
              test_val = extractValue(test_file)
              
              if ref_val is None or test_val is None:
                  print(f"Could not extract values from {ref_file} or {test_file}")
                  return False
              
              rel_diff = abs((test_val - ref_val) / ref_val) if ref_val != 0 else abs(test_val - ref_val)
              
              print(f"Reference: {ref_val}")
              print(f"Test: {test_val}")
              print(f"Relative difference: {rel_diff}")
              
              return rel_diff < tolerance
          
          if __name__ == "__main__":
              if len(sys.argv) != 3:
                  print("Usage: python compare_results.py <reference_log> <test_log>")
                  sys.exit(1)
              
              success = compare_results(sys.argv[1], sys.argv[2])
              sys.exit(0 if success else 1)
          EOF



      - name: Compare Rounding Modes
        run: |
          echo "Comparing results between rounding modes..."
          comparison_failed=false
          error_detected=false
          
          for case_dir in examples/*/; do
            case_name=$(basename "$case_dir")
            
            # Use nearest as reference (most stable)
            ref_file="verrou_reports/${case_name}___tool_verrou__s___rounding_mode_nearest.log"
            
            if [ -f "$ref_file" ]; then
              # Check for Verrou-detected errors first
              if grep -qE "ERROR SUMMARY: [1-9][0-9]*" "$ref_file"; then
                echo "🔍 Verrou detected errors in $case_name (nearest mode):"
                grep -A 5 -B 2 "ERROR SUMMARY:" "$ref_file"
                error_detected=true
              fi
              
              for mode in "average_comdet" "random"; do
                test_file="verrou_reports/${case_name}___tool_verrou__s___rounding_mode_${mode}.log"
                
                if [ -f "$test_file" ]; then
                  # Check for Verrou-detected errors
                  if grep -qE "ERROR SUMMARY: [1-9][0-9]*" "$test_file"; then
                    echo "🔍 Verrou detected errors in $case_name ($mode mode):"
                    grep -A 5 -B 2 "ERROR SUMMARY:" "$test_file"
                    error_detected=true
                  fi
                  
                  # Compare numerical results
                  echo "Comparing $case_name: nearest vs $mode"
                  if ! python3 compare_results.py "$ref_file" "$test_file"; then
                    echo "⚠️ Significant difference detected in $case_name ($mode vs nearest)"
                    comparison_failed=true
                  else
                    echo "✅ Results consistent for $case_name ($mode vs nearest)"
                  fi
                fi
              done
              
              # Additional analysis: Check for NaN, Inf, or suspicious patterns
              for mode_file in "verrou_reports/${case_name}"_*.log; do
                if [ -f "$mode_file" ]; then
                  if grep -qi "nan\|inf\|segmentation\|abort\|crash" "$mode_file"; then
                    echo "🚨 Suspicious patterns found in $(basename "$mode_file"):"
                    grep -i "nan\|inf\|segmentation\|abort\|crash" "$mode_file"
                    error_detected=true
                  fi
                fi
              done
            fi
          done
          
          if [ "$error_detected" = true ]; then
            echo "🚨 Floating-point errors detected by Verrou!"
          elif [ "$comparison_failed" = true ]; then
            echo "⚠️ Some cases showed significant floating-point sensitivity"
          else
            echo "✅ All cases show acceptable floating-point stability"
          fi
      - name: Enhanced Error Detection
        run: |
          echo "Performing rigorous floating-point error detection..."
          
          export PATH="$HOME/.local/bin:$PATH"
          mkdir -p enhanced_reports results_analysis
          
          SIM_EXE=$(find "$PWD/build/staging" -type f -name simulation | head -n 1)
          
          for inp in examples/*/simulation.inp; do
            case_dir=$(dirname "$inp")
            case_name=$(basename "$case_dir")
            run_dir="enhanced_run_$case_name"
            mkdir -p "$run_dir"
            cp "$case_dir"/* "$run_dir"/ 2>/dev/null || true
            cp -r "$case_dir"/restart_data "$run_dir"/ 2>/dev/null || true
            
            echo "=== Rigorous Analysis for $case_name ==="
            
            # 1. Multiple runs with different rounding modes + result extraction
            declare -A results
            modes=(
              "nearest:--tool=verrou --rounding-mode=nearest"
              "random:--tool=verrou --rounding-mode=random"
              "upward:--tool=verrou --rounding-mode=upward"
              "downward:--tool=verrou --rounding-mode=downward"
              "toward_zero:--tool=verrou --rounding-mode=toward_zero"
              "farthest:--tool=verrou --rounding-mode=farthest"
              "average:--tool=verrou --rounding-mode=average"
            )
            
            for mode_pair in "${modes[@]}"; do
              mode_name=${mode_pair%%:*}
              flags=${mode_pair#*:}
              out_file="enhanced_reports/${case_name}_${mode_name}.log"
              
              echo "Running $case_name with $mode_name rounding..."
              (
                cd "$run_dir"
                timeout 300 valgrind $flags "$SIM_EXE" > "../${case_name}_${mode_name}_output.txt" 2> "../$out_file" || true
              )
              
              # Extract numerical results from simulation output
              if [ -f "${case_name}_${mode_name}_output.txt" ]; then
                # Look for final numerical values (adapt patterns as needed)
                result=$(grep -E "(final|result|output|value).*[=:].*[-+]?[0-9]*\.?[0-9]+([eE][-+]?[0-9]+)?" "${case_name}_${mode_name}_output.txt" | \
                         grep -oE "[-+]?[0-9]*\.?[0-9]+([eE][-+]?[0-9]+)?" | tail -1)
                
                if [ -n "$result" ]; then
                  results["$mode_name"]="$result"
                  echo "$mode_name: $result" >> "results_analysis/${case_name}_results.txt"
                fi
              fi
              
              # Check for Valgrind errors
              if grep -qE "ERROR SUMMARY: [1-9][0-9]*" "$out_file"; then
                echo "🚨 Valgrind detected errors in $case_name ($mode_name):"
                grep -A 5 "ERROR SUMMARY: [1-9]" "$out_file"
              fi
              
              # Check for runtime issues
              if grep -qE "nan|inf|segmentation|abort|crash" "$out_file" "${case_name}_${mode_name}_output.txt" 2>/dev/null; then
                echo "🚨 Runtime issues detected in $case_name ($mode_name):"
                grep -E "nan|inf|segmentation|abort|crash" "$out_file" "${case_name}_${mode_name}_output.txt" 2>/dev/null | head -3
              fi
            done
            
            # 2. Statistical analysis of results
            if [ -f "results_analysis/${case_name}_results.txt" ]; then
              echo "Analyzing numerical stability for $case_name..."
              python3 - << EOF
import sys
import statistics
import math

results = {}
with open("results_analysis/${case_name}_results.txt", "r") as f:
    for line in f:
        if ":" in line:
            mode, value = line.strip().split(":", 1)
            try:
                results[mode.strip()] = float(value.strip())
            except ValueError:
                pass

if len(results) < 2:
    print("Insufficient numerical results for analysis")
    sys.exit(0)

values = list(results.values())
mean_val = statistics.mean(values)
std_val = statistics.stdev(values) if len(values) > 1 else 0
cv = (std_val / abs(mean_val)) if mean_val != 0 else float('inf')

print(f"📊 Numerical Analysis for ${case_name}:")
print(f"   Results found: {len(values)}")
print(f"   Mean: {mean_val:.10e}")
print(f"   Std Dev: {std_val:.10e}")
print(f"   Coefficient of Variation: {cv:.10e}")
print(f"   Min: {min(values):.10e}")
print(f"   Max: {max(values):.10e}")
print(f"   Range: {max(values) - min(values):.10e}")

# Detailed comparison
if len(results) > 1:
    print(f"   Mode-wise results:")
    for mode, val in results.items():
        rel_diff = abs(val - mean_val) / abs(mean_val) if mean_val != 0 else abs(val)
        print(f"     {mode}: {val:.10e} (rel_diff: {rel_diff:.2e})")

# Sensitivity thresholds
if cv > 1e-12:
    print("⚠️  MODERATE SENSITIVITY detected")
    if cv > 1e-8:
        print("🚨 HIGH SENSITIVITY detected - Significant floating-point dependency")
    elif cv > 1e-10:
        print("⚠️  MEDIUM SENSITIVITY detected - Notable floating-point effects")
else:
    print("✅ LOW SENSITIVITY - Numerically robust")

# Pairwise comparisons
print(f"   Pairwise relative differences:")
modes = list(results.keys())
max_diff = 0
for i in range(len(modes)):
    for j in range(i+1, len(modes)):
        val1, val2 = results[modes[i]], results[modes[j]]
        rel_diff = abs(val1 - val2) / max(abs(val1), abs(val2)) if max(abs(val1), abs(val2)) != 0 else 0
        max_diff = max(max_diff, rel_diff)
        if rel_diff > 1e-10:
            print(f"     {modes[i]} vs {modes[j]}: {rel_diff:.2e}")

if max_diff > 1e-6:
    print("🚨 CRITICAL: Large differences between rounding modes!")
    sys.exit(1)
elif max_diff > 1e-10:
    print("⚠️  WARNING: Noticeable differences between rounding modes")
EOF
            else
              echo "❌ No numerical results extracted for $case_name"
            fi
            
            # 3. Multiple random runs for stochastic analysis
            echo "Performing stochastic analysis for $case_name..."
            random_results=()
            for seed in {1..5}; do
              echo "Random run $seed for $case_name..."
              (
                cd "$run_dir"
                VERROU_ROUNDING_MODE=random timeout 180 valgrind --tool=verrou --rounding-mode=random "$SIM_EXE" > "../${case_name}_random_${seed}_output.txt" 2>/dev/null || true
              )
              
              if [ -f "${case_name}_random_${seed}_output.txt" ]; then
                result=$(grep -E "(final|result|output|value).*[=:].*[-+]?[0-9]*\.?[0-9]+([eE][-+]?[0-9]+)?" "${case_name}_random_${seed}_output.txt" | \
                         grep -oE "[-+]?[0-9]*\.?[0-9]+([eE][-+]?[0-9]+)?" | tail -1)
                if [ -n "$result" ]; then
                  random_results+=("$result")
                fi
              fi
            done
            
            if [ ${#random_results[@]} -gt 2 ]; then
              python3 - << EOF
import statistics
results = [${random_results[*]}]
mean_val = statistics.mean(results)
std_val = statistics.stdev(results)
cv = (std_val / abs(mean_val)) if mean_val != 0 else float('inf')

print(f"🎲 Stochastic Analysis for ${case_name}:")
print(f"   Random runs: {len(results)}")
print(f"   Mean: {mean_val:.10e}")
print(f"   Std Dev: {std_val:.10e}")
print(f"   CV: {cv:.10e}")

if cv > 1e-8:
    print("🚨 HIGH STOCHASTIC VARIABILITY - Code highly sensitive to rounding")
elif cv > 1e-12:
    print("⚠️  MODERATE STOCHASTIC VARIABILITY detected")
else:
    print("✅ LOW STOCHASTIC VARIABILITY - Consistent across random runs")
EOF
            fi
            
            echo "==============================="
          done

      - name: Advanced Numerical Analysis
        run: |
          echo "Performing advanced numerical stability analysis..."
          
          # Create comprehensive stability report
          cat > stability_analysis.py << 'EOF'
          import os
          import re
          import statistics
          import math
          
          def analyze_case_stability():
              cases = {}
              
              # Read all results
              for filename in os.listdir('results_analysis'):
                  if filename.endswith('_results.txt'):
                      case_name = filename.replace('_results.txt', '')
                      cases[case_name] = {}
                      
                      with open(f'results_analysis/{filename}', 'r') as f:
                          for line in f:
                              if ':' in line:
                                  mode, value = line.strip().split(':', 1)
                                  try:
                                      cases[case_name][mode.strip()] = float(value.strip())
                                  except ValueError:
                                      pass
              
              print("🔍 COMPREHENSIVE FLOATING-POINT STABILITY ANALYSIS")
              print("=" * 60)
              
              overall_issues = 0
              critical_issues = 0
              
              for case_name, results in cases.items():
                  if len(results) < 2:
                      continue
                  
                  values = list(results.values())
                  mean_val = statistics.mean(values)
                  std_val = statistics.stdev(values) if len(values) > 1 else 0
                  cv = (std_val / abs(mean_val)) if mean_val != 0 else float('inf')
                  
                  print(f"\n📊 {case_name}:")
                  
                  # Determine stability level
                  if cv > 1e-6:
                      print(f"   🚨 CRITICAL INSTABILITY (CV: {cv:.2e})")
                      critical_issues += 1
                  elif cv > 1e-10:
                      print(f"   ⚠️  MODERATE INSTABILITY (CV: {cv:.2e})")
                      overall_issues += 1
                  else:
                      print(f"   ✅ STABLE (CV: {cv:.2e})")
                  
                  # Show significant digits lost
                  if cv > 0:
                      digits_lost = -math.log10(cv)
                      print(f"   📉 Approximate significant digits affected: {max(0, 16-digits_lost):.1f}/16")
                  
                  # Worst case scenario
                  max_val, min_val = max(values), min(values)
                  worst_case_error = (max_val - min_val) / abs(mean_val) if mean_val != 0 else 0
                  if worst_case_error > 1e-10:
                      print(f"   📈 Worst-case relative error: {worst_case_error:.2e}")
              
              print(f"\n" + "=" * 60)
              print(f"📈 SUMMARY:")
              print(f"   Total cases analyzed: {len(cases)}")
              print(f"   Critical issues: {critical_issues}")
              print(f"   Moderate issues: {overall_issues}")
              print(f"   Stable cases: {len(cases) - critical_issues - overall_issues}")
              
              if critical_issues > 0:
                  print(f"\n🚨 RECOMMENDATION: {critical_issues} cases show critical floating-point sensitivity!")
                  print(f"   Consider reviewing numerical algorithms in these cases.")
                  return False
              elif overall_issues > 0:
                  print(f"\n⚠️  RECOMMENDATION: {overall_issues} cases show moderate sensitivity.")
                  print(f"   Monitor these cases for numerical stability.")
              else:
                  print(f"\n✅ EXCELLENT: All cases demonstrate good numerical stability.")
              
              return True
          
          if __name__ == "__main__":
              import sys
              stable = analyze_case_stability()
              sys.exit(0 if stable else 1)
          EOF
          
          python3 stability_analysis.py

      - name: Statistical Analysis
        run: |
          cat > statistical_analysis.py << 'EOF'
          import os
          import re
          import statistics
          import sys
          
          def extract_all_values(case_name):
              """Extract all values for a case across different modes"""
              values = []
              pattern = r'result[s]*\s*[=:]\s*([-+]?[0-9]*\.?[0-9]+([eE][-+]?[0-9]+)?)'
              
              for root, dirs, files in os.walk('.'):
                  for file in files:
                      if case_name in file and file.endswith('.log'):
                          filepath = os.path.join(root, file)
                          try:
                              with open(filepath, 'r') as f:
                                  content = f.read()
                                  matches = re.findall(pattern, content, re.IGNORECASE)
                                  for match in matches:
                                      try:
                                          val = float(match[0])
                                          if not (val != val or val == float('inf') or val == float('-inf')):  # Not NaN or Inf
                                              values.append((val, file))
                                      except:
                                          pass
                          except:
                              pass
              return values
          
          def analyze_stability(values):
              """Analyze numerical stability"""
              if len(values) < 2:
                  return "Insufficient data"
              
              nums = [v[0] for v in values]
              mean_val = statistics.mean(nums)
              std_val = statistics.stdev(nums) if len(nums) > 1 else 0
              
              # Calculate coefficient of variation
              cv = (std_val / abs(mean_val)) if mean_val != 0 else float('inf')
              
              print(f"Values found: {len(nums)}")
              print(f"Mean: {mean_val}")
              print(f"Std Dev: {std_val}")
              print(f"Coefficient of Variation: {cv}")
              print(f"Min: {min(nums)}")
              print(f"Max: {max(nums)}")
              
              if cv > 1e-10:
                  print("⚠️ HIGH VARIABILITY DETECTED - Potential floating-point instability")
                  return False
              else:
                  print("✅ Low variability - Numerically stable")
                  return True
          
          # Analyze each case
          cases = set()
          for root, dirs, files in os.walk('.'):
              for file in files:
                  if file.endswith('.log'):
                      # Extract case name from filename
                      parts = file.split('_')
                      if len(parts) > 0:
                          cases.add(parts[0])
          
          overall_stable = True
          for case in sorted(cases):
              print(f"\n=== Statistical Analysis for {case} ===")
              values = extract_all_values(case)
              stable = analyze_stability(values)
              if not stable:
                  overall_stable = False
          
          sys.exit(0 if overall_stable else 1)
          EOF
          
          echo "Running statistical analysis on all results..."
          python3 statistical_analysis.py
  
      - name: Display Results
        run: |
          echo "Verrou reports:"
          for file in verrou_reports/*.log; do
            echo "===== $file ====="
            cat "$file"
          done

      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verrou-reports
          path: verrou_reports/
          