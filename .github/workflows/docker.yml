name: Build MFC Containers

on: [push, pull_request]

jobs:
  container:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        config:
          # - { name: 'cpu',         base_image: 'ubuntu:22.04',      bench: false }
          - { name: 'gpu',         base_image: 'nvcr.io/nvidia/nvhpc:25.5-devel-cuda12.9-ubuntu24.04', bench: false }
          # - { name: 'cpu_bench',   base_image: 'ubuntu:22.04',      bench: true }
          # - { name: 'gpu_bench',   base_image: 'nvcr.io/nvidia/nvhpc:25.5-devel-cuda12.9-ubuntu24.04', bench: true }

    steps:
      - name: Clone
        uses: actions/checkout@v4
        with:
          path: mfc

      - name: Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Setup
        uses: docker/setup-buildx-action@v3
        
      - name: Stage
        run: |
          sudo apt-get clean
          sudo rm -rf /tmp/* /var/lib/apt/lists/* /opt/hostedtoolcache /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/lib/jvm /home/runner/.cache /home/runner/work/_temp
          docker system prune -af || true
          mkdir -p /tmp/mfc_build
          cp -r mfc/* /tmp/mfc_build/
          cp mfc/.github/Dockerfile /tmp/mfc_build/

      - name: Build and Deploy
        uses: docker/build-push-action@v5
        with:
          context: /tmp/mfc_build
          file: /tmp/mfc_build/Dockerfile
          build-args: |
            BASE_IMAGE=${{ matrix.config.base_image }}
          tags: mohdsaid497566/mfc:${{ matrix.config.name }}
          load: true
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max