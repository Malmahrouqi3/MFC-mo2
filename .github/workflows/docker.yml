name: Containerization

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'tag to containerize'
        required: true

concurrency:
  group: Containerization-${{ github.event.inputs.tag }}
  cancel-in-progress: false
  
jobs:
  Container:
    continue-on-error: true
    strategy:
      matrix:
        config:
            - { name: 'cpu',  interface: 'none', runner: 'ubuntu-22.04',         base_image: 'ubuntu:22.04' }
            - { name: 'gpu',  interface: 'acc',  runner: 'ubuntu-22.04',         base_image: 'nvcr.io/nvidia/nvhpc:23.11-devel-cuda_multi-ubuntu22.04' }
            - { name: 'gpu',  interface: 'acc',  runner: 'ubuntu-22.04-arm',     base_image: 'nvcr.io/nvidia/nvhpc:23.11-devel-cuda_multi-ubuntu22.04' }
            - { name: 'gpu',  interface: 'mp',  runner: 'ubuntu-22.04',         base_image: 'nvcr.io/nvidia/nvhpc:23.11-devel-cuda_multi-ubuntu22.04' }
            - { name: 'gpu',  interface: 'mp',  runner: 'ubuntu-22.04-arm',     base_image: 'nvcr.io/nvidia/nvhpc:23.11-devel-cuda_multi-ubuntu22.04' }

    runs-on: ${{ matrix.config.runner }}
    steps:

      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Setup
        uses: docker/setup-buildx-action@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Checkout base repo
        run: |
          git clone --branch ${{ github.event.inputs.tag }} --depth 1 https://github.com/MFlowCode/MFC.git mfc
    
      - name: Checkout PR repo
        uses: actions/checkout@v3
        with:
          path: pr

      - name: Prepare Docker context
        run: |
          sudo fallocate -l 8G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          sudo mkdir -p /home/runner/tmp
          export TMPDIR=/home/runner/tmp
          free -h
          
          sudo mkdir -p /mnt/share
          sudo chmod 777 /mnt/share
          rm -rf /mnt/share/*
          cp -r mfc/* /mnt/share/
          cp -r mfc/.git /mnt/share/.git
          cp pr/.github/Dockerfile /mnt/share/
          cp pr/.github/.dockerignore /mnt/share/
          cp pr/toolchain/dependencies/Silo.patch /mnt/share/toolchain/dependencies/Silo.patch

      - name: Replace old SILO block in CMakeLists.txt
        run: |
          if [ -f /mnt/share/toolchain/pyproject.toml ]; then
              sed -i 's/"cantera",/"cantera==3.0.1",/g' /mnt/share/toolchain/pyproject.toml
          fi

          sed -i '/# SILO/,/^endif()/{
              r /dev/stdin
              d
          }' /mnt/share/toolchain/dependencies/CMakeLists.txt <<'EOF'
          # SILO
          if (MFC_SILO)
              find_package(SILO)
              if (SILO_FOUND)
                  message(STATUS "SILO found.")
                  add_custom_target(silo)
              else()
                  find_package(Git REQUIRED)

                  ExternalProject_Add(silo
                      GIT_REPOSITORY "https://github.com/LLNL/Silo"
                      GIT_TAG        9af504ef4fb79153e1fbf3bdb75421b6b65f6dc4
                      GIT_PROGRESS   ON
                      PATCH_COMMAND  "${GIT_EXECUTABLE}" stash
                                  && "${GIT_EXECUTABLE}" apply "${CMAKE_SOURCE_DIR}/Silo.patch"
                      CMAKE_ARGS     -DSILO_ENABLE_SHARED=OFF
                                    -DSILO_ENABLE_SILOCK=OFF
                                    -DSILO_ENABLE_BROWSER=OFF
                                    -DFIND_LIBRARY_USE_LIB64_PATHS=ON
                                    "-DCMAKE_PREFIX_PATH=${CMAKE_PREFIX_PATH}"
                                    "-DCMAKE_FIND_ROOT_PATH=${CMAKE_FIND_ROOT_PATH}"
                                    "-DCMAKE_FIND_PACKAGE_REDIRECTS_DIR=${CMAKE_FIND_PACKAGE_REDIRECTS_DIR}"
                                    "-DCMAKE_INSTALL_PREFIX=${CMAKE_INSTALL_PREFIX}"
                                    "$<$<STREQUAL:${CMAKE_Fortran_COMPILER_ID},Cray>:-DCMAKE_MODULE_PATH=${CMAKE_SOURCE_DIR}/../cmake/cce>"
                  )
                endif()
          endif()
          EOF
          docker buildx create --name mfcbuilder --driver docker-container --use


      - name: Build and push image (cpu)
        if: ${{ matrix.config.name == 'cpu' }}
        uses: docker/build-push-action@v6
        with:
          builder: mfcbuilder
          context: /mnt/share
          file: /mnt/share/Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: |
            BASE_IMAGE=${{ matrix.config.base_image }}
            TARGET=${{ matrix.config.name }}
            INTERFACE=${{ matrix.config.interface }}
            CC_COMPILER=${{ contains(matrix.config.name, 'gpu') && 'nvc' || 'gcc' }}
            CXX_COMPILER=${{ contains(matrix.config.name, 'gpu') && 'nvc++' || 'g++' }}
            FC_COMPILER=${{ contains(matrix.config.name, 'gpu') && 'nvfortran' || 'gfortran' }}
            COMPILER_PATH=${{ contains(matrix.config.name, 'gpu') && '/opt/nvidia/hpc_sdk/Linux_x86_64/compilers/bin' || '/usr/bin' }}
            COMPILER_LD_LIBRARY_PATH=${{ contains(matrix.config.name, 'gpu') && '/opt/nvidia/hpc_sdk/Linux_x86_64/compilers/lib' || '/usr/lib' }}
          tags: mohdsaid497566/mfc:${{ github.event.inputs.tag }}-${{ matrix.config.name }}
          push: true

      - name: Build and push image (gpu)
        if: ${{ matrix.config.name == 'gpu' }}
        uses: docker/build-push-action@v5
        with:
          builder: default
          context: /mnt/share
          file: /mnt/share/Dockerfile
          build-args: |
            BASE_IMAGE=${{ matrix.config.base_image }}
            TARGET=${{ matrix.config.name }}
            INTERFACE=${{ matrix.config.interface }}
            CC_COMPILER=${{ contains(matrix.config.name, 'gpu') && 'nvc' || 'gcc' }}
            CXX_COMPILER=${{ contains(matrix.config.name, 'gpu') && 'nvc++' || 'g++' }}
            FC_COMPILER=${{ contains(matrix.config.name, 'gpu') && 'nvfortran' || 'gfortran' }}
            COMPILER_PATH=${{ contains(matrix.config.name, 'gpu') && '/opt/nvidia/hpc_sdk/Linux_x86_64/compilers/bin' || '/usr/bin' }}
            COMPILER_LD_LIBRARY_PATH=${{ contains(matrix.config.name, 'gpu') && '/opt/nvidia/hpc_sdk/Linux_x86_64/compilers/lib' || '/usr/lib' }}
          tags: mohdsaid497566/mfc:${{ github.event.inputs.tag }}-${{ matrix.config.name }}-${{ matrix.config.interface }}-${{ matrix.config.runner}}
          push: true

  manifests:
    runs-on: ubuntu-latest
    needs: Container
    steps:
      - name: Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Create and push multi-arch manifests
        run: |
          # CPU Manifest
          docker buildx imagetools create -t mohdsaid497566/mfc:latest-cpu \
            mohdsaid497566/mfc:${{ github.event.inputs.tag }}-cpu
          
          # GPU Manifest (ACC)
          docker manifest create mohdsaid497566/mfc:${{ github.event.inputs.tag }}-gpu \
            mohdsaid497566/mfc:${{ github.event.inputs.tag }}-gpu-acc-ubuntu-22.04 \
            mohdsaid497566/mfc:${{ github.event.inputs.tag }}-gpu-acc-ubuntu-22.04-arm
          docker manifest push mohdsaid497566/mfc:${{ github.event.inputs.tag }}-gpu

          docker manifest create mohdsaid497566/mfc:latest-gpu \
            mohdsaid497566/mfc:${{ github.event.inputs.tag }}-gpu-acc-ubuntu-22.04 \
            mohdsaid497566/mfc:${{ github.event.inputs.tag }}-gpu-acc-ubuntu-22.04-arm
          docker manifest push mohdsaid497566/mfc:latest-gpu

          # GPU Manifest (OMP)
          docker manifest create mohdsaid497566/mfc:${{ github.event.inputs.tag }}-mp-gpu \
            mohdsaid497566/mfc:${{ github.event.inputs.tag }}-gpu-mp-ubuntu-22.04 \
            mohdsaid497566/mfc:${{ github.event.inputs.tag }}-gpu-mp-ubuntu-22.04-arm
          docker manifest push mohdsaid497566/mfc:${{ github.event.inputs.tag }}-mp-gpu

          docker manifest create mohdsaid497566/mfc:latest-mp-gpu \
            mohdsaid497566/mfc:${{ github.event.inputs.tag }}-gpu-mp-ubuntu-22.04 \
            mohdsaid497566/mfc:${{ github.event.inputs.tag }}-gpu-mp-ubuntu-22.04-arm
          docker manifest push mohdsaid497566/mfc:latest-mp-gpu
