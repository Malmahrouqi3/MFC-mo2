name: Build MFC Containers

on: [push, pull_request]

jobs:
  container:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        config:
          - { name: 'cpu',         base_image: 'ubuntu:22.04',      bench: false }
          - { name: 'gpu',         base_image: 'nvcr.io/nvidia/nvhpc:25.5-devel-cuda12.9-ubuntu24.04', bench: false }
          - { name: 'cpu_bench',   base_image: 'ubuntu:22.04',      bench: true }
          - { name: 'gpu_bench',   base_image: 'nvcr.io/nvidia/nvhpc:25.5-devel-cuda12.9-ubuntu24.04', bench: true }

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: mfc
          
      - name: Docker Hub Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Build
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./mfc
          file: ./mfc/.github/Dockerfile
          build-args: |
            BASE_IMAGE=${{ matrix.config.base_image }}
          tags: my-org/mfc:${{ matrix.config.name }}
          load: true
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max