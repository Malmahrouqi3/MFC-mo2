name: Build and Deploy Docker Images

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Git tag to build'
        required: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        config:
          - { name: 'cpu', base_image: 'ubuntu:22.04' }
          - { name: 'gpu', base_image: 'nvcr.io/nvidia/nvhpc:23.11-devel-cuda12.3-ubuntu22.04' }
    steps:
      - name: Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Setup
        uses: docker/setup-buildx-action@v3

      - name: Checkout base repo
        run: |
          git clone --branch ${{ github.event.inputs.tag }} --depth 1 https://github.com/MFlowCode/MFC.git mfc
    
      - name: Checkout PR repo
        uses: actions/checkout@v3
        with:
          path: pr

      - name: Prepare Docker context
        run: |
          sudo mkdir -p /mnt/share
          sudo chmod 777 /mnt/share
          rm -rf /mnt/share/*
          cp -r mfc/* /mnt/share/
          cp -r mfc/.git /mnt/share/.git
          cp pr/.github/Dockerfile /mnt/share/
          cp pr/.github/.dockerignore /mnt/share/
          cp pr/toolchain/dependencies/Silo.patch /mnt/share/
          grep -rl 'https://github.com/henryleberre/Silo' . | xargs sed -i 's|https://github.com/henryleberre/Silo|https://github.com/LLNL/Silo|g'

      - name: Replace old SILO block in CMakeLists.txt
        run: |
          sed -i '/# SILO/,/^endif()/c\
          # SILO\n\
          if (MFC_SILO)\n\
              ExternalProject_Add(silo\n\
                  GIT_REPOSITORY "https://github.com/henryleberre/Silo"\n\
                  GIT_TAG        964d993039b467e3d472d3a70afd03380fe2c320\n\
                  GIT_SHALLOW    ON\n\
                  GIT_PROGRESS   ON\n\
                  CMAKE_ARGS     -DSILO_ENABLE_SHARED=OFF\n\
                                -DSILO_ENABLE_SILOCK=OFF\n\
                                -DSILO_ENABLE_BROWSER=OFF\n\
                                -DHDF5_USE_STATIC_LIBRARIES=ON\n\
                                "-DCMAKE_INSTALL_PREFIX=${CMAKE_INSTALL_PREFIX}"\n\
                                $<$<BOOL:${MFC_BUILD_HDF5}>:"-DSILO_HDF5_DIR=\\"${CMAKE_INSTALL_PREFIX}\\"">\n\
              )\n\
          \n\
              if (MFC_HDF5 AND NOT CMAKE_Fortran_COMPILER_ID STREQUAL "Cray")\n\
                  add_dependencies(silo hdf5)\n\
              endif()\n\
          endif()' /mnt/share/toolchain/dependencies/CMakeLists.txt

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          platforms: linux/arm64,linux/amd64
          context: /mnt/share
          file: /mnt/share/Dockerfile
          build-args: |
            BASE_IMAGE=${{ matrix.config.base_image }}
            TARGET=${{ matrix.config.name }}
            CC_COMPILER=${{ contains(matrix.config.name, 'gpu') && 'nvc' || 'gcc' }}
            CXX_COMPILER=${{ contains(matrix.config.name, 'gpu') && 'nvc++' || 'g++' }}
            FC_COMPILER=${{ contains(matrix.config.name, 'gpu') && 'nvfortran' || 'gfortran' }}
            COMPILER_PATH=${{ contains(matrix.config.name, 'gpu') && '/opt/nvidia/hpc_sdk/Linux_x86_64/compilers/bin' || '/usr/bin' }}
            COMPILER_LD_LIBRARY_PATH=${{ contains(matrix.config.name, 'gpu') && '/opt/nvidia/hpc_sdk/Linux_x86_64/compilers/lib' || '/usr/lib' }}
          tags: mohdsaid497566/mfc:${{ github.event.inputs.tag }}-${{ matrix.config.name }}
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max