name: Containers

on: [push, pull_request]

jobs:
  container:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        config:
          - { name: 'cpu',         base_image: 'ubuntu:22.04',      bench: false }
          - { name: 'gpu',         base_image: 'nvcr.io/nvidia/nvhpc:23.11-devel-cuda12.3-ubuntu22.04', bench: false }
          # - { name: 'cpu_bench',   base_image: 'ubuntu:22.04',      bench: true }
          # - { name: 'gpu_bench',   base_image: 'nvcr.io/nvidia/nvhpc:25.5-devel-cuda12.9-ubuntu24.04', bench: true }
      
    steps:
      - name: Clone
        uses: actions/checkout@v4
        with:
          path: mfc

      - name: Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Setup
        uses: docker/setup-buildx-action@v3
        
      - name: Stage
        run: |
          sudo docker system prune -af || true
          sudo docker image prune -af || true
          sudo docker builder prune -af || true
          sudo rm -rf /var/lib/docker/*
          sudo rm -rf /var/lib/containerd/*
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo rm -rf /usr/local/share/boost /usr/lib/jvm
          sudo rm -rf /opt/hostedtoolcache /home/runner/.cache
          sudo rm -rf /var/lib/apt/lists/*
          sudo apt-get clean
          sudo rm -rf /tmp/*
          sudo rm -rf /home/runner/work/_temp
          sudo rm -rf /home/runner/.npm /home/runner/.cargo /home/runner/.rustup
          sudo rm -rf /usr/local/share/edge_driver /usr/local/share/chromium
          sudo rm -rf /usr/local/share/powershell /usr/local/share/swift
          sudo rm -rf /usr/local/share/vcpkg
          sudo rm -rf /usr/share/swift
          df -h
          sudo mkdir -p /mnt/share
          sudo chmod 777 /mnt/share
          cp -r mfc/* /mnt/share/
          cp -r mfc/.git /mnt/share/.git
          cp mfc/.github/Dockerfile /mnt/share/
          docker buildx create --name mfcbuilder --driver docker-container --use

      - name: Build and Deploy
        uses: docker/build-push-action@v5
        with:
          builder: mfcbuilder
          context: /mnt/share
          file: /mnt/share/Dockerfile
          build-args: |
            BASE_IMAGE=${{ matrix.config.base_image }}
            CC_COMPILER=${{ contains(matrix.config.base_image, 'nvidia') && 'nvc' || 'gcc' }}
            CXX_COMPILER=${{ contains(matrix.config.base_image, 'nvidia') && 'nvc++' || 'g++' }}
            FC_COMPILER=${{ contains(matrix.config.base_image, 'nvidia') && 'nvfortran' || 'gfortran' }}
            COMPILER_PATH=${{ contains(matrix.config.base_image, 'nvidia') && '/opt/nvidia/hpc_sdk/Linux_x86_64/compilers/bin' || '/usr/bin' }}
            COMPILER_LD_LIBRARY_PATH=${{ contains(matrix.config.base_image, 'nvidia') && '/opt/nvidia/hpc_sdk/Linux_x86_64/compilers/lib' || '/usr/lib' }}
          tags: mohdsaid497566/mfc:${{ matrix.config.name }}
          load: true
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
