name: Release Dispatcher

on:
  workflow_dispatch:
    inputs:
      from_tag:
        description: 'Start tag (e.g. v4.3.0)'
        required: true
      to_tag:
        description: 'End tag (e.g. v5.0.5)'
        required: true

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Get tags in range
        id: tags
        run: |
          git clone --quiet https://github.com/MFlowCode/MFC.git mfc
          cd mfc
          git fetch --tags
          TAGS=$(git tag --sort=creatordate)
          TAGS_IN_RANGE=$(awk "/^${{ github.event.inputs.from_tag }}$/,/^${{ github.event.inputs.to_tag }}$/" <<< "$TAGS" | grep -v '^$')
          echo "tags=$(echo $TAGS_IN_RANGE | tr '\n' ' ')" >> $GITHUB_OUTPUT

      - name: Dispatch docker.yml for each tag
        uses: actions/github-script@v7
        with:
          script: |
            const tags = '${{ steps.tags.outputs.tags }}'.split(' ').filter(Boolean);
            for (const tag of tags) {
              const beforeDispatch = Date.now();
              
              await github.rest.actions.createWorkflowDispatch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'docker.yml',
                ref: context.ref.replace('refs/heads/', ''),
                inputs: { tag }
              });

              // Wait a bit for the workflow to be created
              await new Promise(resolve => setTimeout(resolve, 5000));

              let runId = null;
              for (let i = 0; i < 60; i++) { // Try for up to 300 seconds
                const runs = await github.rest.actions.listWorkflowRuns({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  workflow_id: 'docker.yml',
                  event: 'workflow_dispatch',
                  per_page: 10
                });
                
                // Find a run that was created after we dispatched and matches our tag
                const found = runs.data.workflow_runs.find(run => {
                  const runCreatedAt = new Date(run.created_at).getTime();
                  return runCreatedAt >= beforeDispatch && 
                         ['queued', 'in_progress', 'waiting'].includes(run.status);
                });
                
                if (found) {
                  // Double-check by fetching the workflow run details to verify the input tag
                  const runJobs = await github.rest.actions.listJobsForWorkflowRun({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    run_id: found.id
                  });
                  
                  runId = found.id;
                  console.log(`Found workflow run ${runId} for tag ${tag}`);
                  break;
                }
                await new Promise(resolve => setTimeout(resolve, 5000));
              }
              
              if (!runId) {
                core.setFailed(`Could not find workflow run for tag ${tag}`);
                return;
              }

              console.log(`Waiting for workflow run ${runId} (tag: ${tag}) to complete...`);
              let completed = false;
              while (!completed) {
                const run = await github.rest.actions.getWorkflowRun({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  run_id: runId
                });
                if (run.data.status === 'completed') {
                  if (run.data.conclusion !== 'success') {
                    core.setFailed(`Workflow for tag ${tag} failed with conclusion: ${run.data.conclusion}`);
                    return;
                  }
                  completed = true;
                  console.log(`Workflow run ${runId} (tag: ${tag}) completed successfully`);
                } else {
                  await new Promise(resolve => setTimeout(resolve, 15000));
                }
              }
            }
